<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Chest Rig Visualizer</title>
<style>
/*
VOICE: club gear, stage lighting rig, no chrome
IDEA: an LED panel strapped to a chest rig
PICTURE: the full-screen canvas is the whole page
COLOUR and TYPE: pure black ground, hue per note (pitch class), Red Hat Text for small UI
LAYOUT: edge-to-edge canvas, a control strip that appears on tap and hides itself
*/
:root{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:#000;color:#eee;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none;font:15px/1.4 "Red Hat Text",system-ui,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#ui{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:14px;pointer-events:none;transition:opacity .35s}
#ui.hidden{opacity:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#ui:not(.hidden) .row{pointer-events:auto}
button{font:inherit;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid #3a3a3a;background:rgba(18,18,18,.82);color:#eee}
button.on{border-color:#2fe39a;color:#2fe39a}
button:focus-visible{outline:2px solid #2fe39a;outline-offset:2px}
#status{background:rgba(0,0,0,.7);border:1px solid #2a2a2a;padding:8px 12px;border-radius:10px;font-size:13px;max-width:62ch}
#fps{font-size:13px;color:#2fe39a;background:rgba(0,0,0,.7);padding:8px 10px;border-radius:10px;font-variant-numeric:tabular-nums}
#hint{font-size:13px;color:#aaa;background:rgba(0,0,0,.6);padding:6px 10px;border-radius:8px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div class="row"><div id="status">Starting MIDI…</div><div id="fps">– fps</div></div>
  <div class="row">
    <span id="modes" class="row"></span>
    <button id="demo">Demo</button>
    <button id="full">Fullscreen + keep awake</button>
    <span id="hint">Tap the screen to show or hide controls. Program Change 0–3 switches modes.</span>
  </div>
</div>
<script>
{
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const ui=document.getElementById('ui'),statusEl=document.getElementById('status'),fpsEl=document.getElementById('fps');
let W=0,H=0,DPR=1;
function resize(){DPR=1; // render at CSS pixels: glows are soft anyway, and it is 4-8x less work on a phone
W=cv.width=Math.round(innerWidth*DPR);H=cv.height=Math.round(innerHeight*DPR);ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);}
addEventListener('resize',resize);resize();

const MODES=['Pulse','Bars','Rings','Grid'];
const S={held:new Map(),energy:new Float32Array(128),cc:new Float32Array(128),bend:0,flash:0,flashHue:0,mode:0,demo:false};
const events=[];
try{const m=+localStorage.getItem('crv-mode');if(m>=0&&m<MODES.length)S.mode=m;}catch(e){}

const hueOf=n=>((n%12)*30+S.cc[74]*360+S.bend*30+360)%360;
const xOf=n=>Math.min(1,Math.max(0,(n-24)/84));

function noteOn(n,v,ch){
  v/=127;
  if(ch===9){S.flash=Math.max(S.flash,(n<=36?1:0.45)*v);S.flashHue=hueOf(n);return;}
  S.held.set(n,v);S.energy[n]=Math.max(S.energy[n],v);
  events.push({n,v,t:performance.now(),hue:hueOf(n),y:0.2+Math.random()*0.6});
  if(events.length>160)events.splice(0,events.length-160);
}
function noteOff(n,ch){if(ch!==9)S.held.delete(n);}
function allOff(){S.held.clear();}

function onMsg(e){
  const d=e.data,cmd=d[0]&0xf0,ch=d[0]&0x0f;
  if(cmd===0x90&&d[2]>0)noteOn(d[1],d[2],ch);
  else if(cmd===0x80||cmd===0x90)noteOff(d[1],ch);
  else if(cmd===0xB0){S.cc[d[1]]=d[2]/127;if(d[1]===120||d[1]===123)allOff();}
  else if(cmd===0xE0)S.bend=(((d[2]<<7)|d[1])-8192)/8192;
  else if(cmd===0xC0)setMode(d[1]%MODES.length);
}

let access=null;
function bindInputs(){
  const names=[];
  for(const inp of access.inputs.values()){inp.onmidimessage=onMsg;names.push(inp.name);}
  statusEl.textContent=names.length?'MIDI in: '+names.join(', '):'No MIDI inputs yet. Plug in USB‑MIDI or connect a Bluetooth MIDI device; it appears here automatically.';
}
async function initMIDI(){
  if(!navigator.requestMIDIAccess){statusEl.textContent='No Web MIDI here. Open this page in Chrome on Android.';return;}
  try{access=await navigator.requestMIDIAccess();access.onstatechange=bindInputs;bindInputs();}
  catch(err){statusEl.textContent='MIDI access blocked ('+err.name+'). Allow MIDI for this site, or open the page outside the Claude viewer.';}
}
initMIDI();

// UI
const modesEl=document.getElementById('modes');
modesEl.innerHTML=MODES.map((m,i)=>`<button data-m="${i}">${m}</button>`).join('');
function setMode(m){S.mode=m;try{localStorage.setItem('crv-mode',m);}catch(e){}for(const b of modesEl.children)b.classList.toggle('on',+b.dataset.m===m);}
setMode(S.mode);
modesEl.addEventListener('click',e=>{const b=e.target.closest('button');if(b){setMode(+b.dataset.m);poke();}});

let hideT=0;
function poke(){ui.classList.remove('hidden');clearTimeout(hideT);hideT=setTimeout(()=>ui.classList.add('hidden'),5000);}
cv.addEventListener('click',()=>{if(!wake||wake.released)keepAwake();if(ui.classList.contains('hidden'))poke();else{clearTimeout(hideT);ui.classList.add('hidden');}});
poke();

let wake=null;
async function keepAwake(){try{wake=await navigator.wakeLock.request('screen');}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(wake&&document.visibilityState==='visible')keepAwake();});
document.getElementById('full').addEventListener('click',async()=>{
  try{await document.documentElement.requestFullscreen();}catch(e){}
  try{await screen.orientation.lock('landscape');}catch(e){}
  keepAwake();if(!access)initMIDI();poke();
});

// Demo: arpeggio + kick, so you can test without any MIDI gear
const demoBtn=document.getElementById('demo');let demoT=0,step=0;
const scale=[0,3,5,7,10,12,15,17];
demoBtn.addEventListener('click',()=>{
  S.demo=!S.demo;demoBtn.classList.toggle('on',S.demo);clearInterval(demoT);
  if(S.demo)demoT=setInterval(()=>{
    const root=48+[0,5,3,7][Math.floor(step/16)%4];
    const n=root+scale[(step*3)%scale.length]+(step%4===0?12:0);
    noteOn(n,70+Math.random()*57,0);setTimeout(()=>noteOff(n,0),110);
    if(step%4===0)noteOn(36,120,9);
    S.cc[74]=(Math.sin(step/40)+1)/4;step++;
  },125);
  else allOff();
  poke();
});

// Rendering
let last=performance.now(),fpsN=0,fpsT=last,fps=0;
function frame(){
  requestAnimationFrame(frame); // schedule first, so one bad frame can never stop the loop
  try{draw();}catch(err){console.error(err);}
}
function draw(){
  const now=performance.now();
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  fpsN++;if(now-fpsT>1000){fps=fpsN;fpsN=0;fpsT=now;fpsEl.textContent=fps+' fps';}
  const trail=S.cc[1];
  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle=`rgba(0,0,0,${0.32-trail*0.26})`;ctx.fillRect(0,0,W,H);

  for(let n=0;n<128;n++){
    const h=S.held.get(n);
    if(h!==undefined)S.energy[n]+=(h*0.85-S.energy[n])*Math.min(1,dt*6);
    else S.energy[n]*=Math.exp(-dt*5);
  }
  const life=600+trail*1800;
  while(events.length&&now-events[0].t>life)events.shift();

  ctx.globalCompositeOperation='lighter';
  [pulse,bars,rings,grid][S.mode](now,life);

  if(S.flash>0.01){
    ctx.globalCompositeOperation='lighter';
    ctx.fillStyle=`hsla(${S.flashHue},90%,60%,${S.flash*0.55})`;ctx.fillRect(0,0,W,H);
    S.flash*=Math.exp(-dt*9);
  }
}

// Pre-rendered glow sprites (one per 6 degrees of hue) instead of a new gradient per dot per frame
const sprites=new Map();
function sprite(hue){
  const k=Math.round(hue/6)%60;
  let s=sprites.get(k);
  if(!s){
    s=document.createElement('canvas');s.width=s.height=128;
    const c=s.getContext('2d'),g=c.createRadialGradient(64,64,0,64,64,64),h=k*6;
    g.addColorStop(0,`hsla(${h},100%,75%,1)`);g.addColorStop(0.4,`hsla(${h},100%,55%,0.6)`);g.addColorStop(1,`hsla(${h},100%,40%,0)`);
    c.fillStyle=g;c.fillRect(0,0,128,128);sprites.set(k,s);
  }
  return s;
}
function glowDot(x,y,r,hue,a){
  if(!(r>0)||!(a>0))return;
  ctx.globalAlpha=Math.min(1,a);
  ctx.drawImage(sprite(hue),x-r,y-r,r*2,r*2);
  ctx.globalAlpha=1;
}
const age=(now,t,life)=>Math.min(1,Math.max(0,(now-t)/life));

function pulse(now,life){
  const base=Math.min(W,H);
  for(const e of events){
    const a=age(now,e.t,life);
    const x=(0.06+xOf(e.n)*0.88)*W+S.bend*W*0.05;
    const r=base*(0.05+e.v*0.22)*(0.35+a);
    glowDot(x,e.y*H,r,e.hue,(1-a)*(0.4+e.v*0.6));
  }
}

function bars(){
  const lo=21,hi=108,count=hi-lo+1,bw=W/count,mid=H/2;
  for(let n=lo;n<=hi;n++){
    const e=S.energy[n];if(e<0.01)continue;
    const h=e*H*0.46,x=(n-lo)*bw,hue=hueOf(n);
    const g=ctx.createLinearGradient(0,mid-h,0,mid+h);
    g.addColorStop(0,`hsla(${hue},100%,50%,0)`);g.addColorStop(0.5,`hsla(${hue},100%,62%,${0.5+e*0.5})`);g.addColorStop(1,`hsla(${hue},100%,50%,0)`);
    ctx.fillStyle=g;ctx.fillRect(x+bw*0.12,mid-h,bw*0.76,h*2);
  }
}

function rings(now,life){
  const cx=W/2,cy=H/2,maxR=Math.hypot(W,H)/2;
  for(const e of events){
    const a=age(now,e.t,life);
    ctx.strokeStyle=`hsla(${e.hue},100%,62%,${(1-a)*e.v})`;
    ctx.lineWidth=Math.max(1,(1-a)*e.v*28*DPR);
    ctx.beginPath();ctx.arc(cx,cy,a*maxR,0,Math.PI*2);ctx.stroke();
  }
  let sum=0,hueAcc=0;for(const[n,v]of S.held){sum+=v;hueAcc=hueOf(n);}
  if(sum>0)glowDot(cx,cy,Math.min(W,H)*(0.08+Math.min(sum,3)*0.06),hueAcc,0.9);
}

function grid(){
  const cols=12,rows=8,pad=Math.min(W,H)*0.04;
  const cw=(W-pad*2)/cols,ch=(H-pad*2)/rows,r=Math.min(cw,ch)*0.42;
  for(let o=0;o<rows;o++)for(let p=0;p<cols;p++){
    const n=24+o*12+p,e=S.energy[n];
    const x=pad+cw*(p+0.5),y=H-pad-ch*(o+0.5);
    ctx.fillStyle='rgba(255,255,255,0.035)';ctx.beginPath();ctx.arc(x,y,r*0.55,0,Math.PI*2);ctx.fill();
    if(e>0.01)glowDot(x,y,r*(0.8+e*0.9),hueOf(n),0.35+e*0.65);
  }
}

requestAnimationFrame(frame);
}
</script>
</body>
</html>
